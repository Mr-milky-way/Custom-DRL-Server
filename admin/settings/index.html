<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings</title>
    <link rel="stylesheet" href="/admin/main.css">
    <script src="/admin/index.js"></script>
</head>

<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>Admin Panel</h2>
        </div>
        <ul class="nav-links">
            <li><a href="/admin/dashboard/">Dashboard</a></li>
            <li><a href="/admin/tournaments/">Tournaments</a></li>
            <li><a href="/admin/users/">Admin Users</a></li>
            <li><a href="/admin/map-pools/">Map Pools</a></li>
            <li class="active"><a href="/admin/settings/">Settings</a></li>
            <li class="logout"><a href="/admin/logout">Logout</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <header class="top-bar">
            <h1>Settings</h1>
        </header>
        <section class="data-section">
            <h2>Server Management</h2>
            <section class="stats-grid">
                <div class="stat-card">
                    <h3 id="ReqPullRes">Waiting for response...</h3>
                    <button onclick="pullUpdates();">Pull New Updates</button>
                </div>
                <div class="stat-card">
                    <h3 id="ReqRebootRes">Waiting for response...</h3>
                    <button onclick="RestartServer();">Restart Server</button>
                </div>
            </section>
        </section>
    </main>
</body>

</html>
